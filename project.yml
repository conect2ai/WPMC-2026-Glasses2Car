# Generate the Xcode project with:  xcodegen generate  (brew install xcodegen)
name: RayBanTripApp
options:
  bundleIdPrefix: br.ufrn.conect2ai   # DAT beta does not allow '-' in bundle IDs
  deploymentTarget:
    iOS: "16.0"                       # DAT floor is 15.2; we need iOS 16 SwiftUI APIs
  createIntermediateGroups: true

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 0.8.0
  Conect2AICore:
    path: Conect2AICore

targets:
  RayBanTripApp:
    type: application
    platform: iOS
    sources: [App]
    # Team ID e credenciais da Meta vêm do Local.xcconfig (não versionado);
    # copie Local.xcconfig.example e preencha os seus valores.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # Product names come from the meta-wearables-dat-ios package; adjust here
      # if the package manifest exposes a single umbrella product instead.
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
      - package: MetaWearablesDAT
        product: MWDATDisplay
      - package: Conect2AICore
        product: Conect2AICore
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: Usada para transmitir a câmera dos óculos.
        NSBluetoothAlwaysUsageDescription: Necessária para conectar aos óculos Ray-Ban Meta.
        NSLocalNetworkUsageDescription: Necessária para transmitir vídeo dos óculos via Wi-Fi.
        NSMicrophoneUsageDescription: Usado para ouvir os comandos de voz pelo microfone dos óculos.
        NSSpeechRecognitionUsageDescription: Usado para reconhecer os comandos de voz ("ei Conecta").
        NSLocationWhenInUseUsageDescription: Registra a localização do motorista em cada consulta, para as métricas do estudo.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSExceptionDomains:
            testes.conect2ai.dca.ufrn.br:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSBonjourServices: [_bonjour._tcp]
        UIBackgroundModes: [bluetooth-central, audio, location]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [conect2aiglasses]
        MWDAT:
          AppLinkURLScheme: "conect2aiglasses://"
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)

  RayBanTripAppTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/MockDeviceTests
    dependencies:
      - target: RayBanTripApp
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATMockDevice
      - package: MetaWearablesDAT
        product: MWDATDisplay
      - package: Conect2AICore
        product: Conect2AICore

schemes:
  RayBanTripApp:
    build:
      targets:
        RayBanTripApp: all
        RayBanTripAppTests: [test]
    test:
      targets: [RayBanTripAppTests]
